name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  export-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
          include-templates: true
      - name: Import project
        run: godot --headless --editor --path . --import
      - name: Export Android APK
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/Vitek-Path-to-9.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Vitek-Path-to-9-Android-APK
          path: build/Vitek-Path-to-9.apk
          if-no-files-found: error
